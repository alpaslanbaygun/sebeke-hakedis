<!-- M12 Dışa aktar -->
<template data-body-class="bg-background font-body-md text-on-surface min-h-screen antialiased">
<header class="fixed top-0 w-full z-50 pt-safe bg-primary-container shadow-[0_1px_8px_rgba(0,0,0,0.12)]">
  <div class="h-16 px-margin flex items-center gap-space-sm">
    <button data-a="back" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-primary" aria-label="Geri"><span class="material-symbols-outlined">arrow_back</span></button>
    <h1 class="flex-1 text-headline-md font-headline-md text-on-primary truncate">Dışa Aktar</h1>
  </div>
</header>
<main class="pt-16 pb-space-lg px-margin min-h-screen flex flex-col gap-space-md">
  <p class="pt-space-md text-body-md font-body-md text-on-surface-variant">“Paylaş” Android paylaşım menüsünü açar: <b>Drive</b>, e-posta, WhatsApp… “Kaydet” dosyayı seçtiğiniz klasöre (Drive klasörü dahil) yazar.</p>

  <section class="card p-space-md flex flex-col gap-space-sm">
    <div class="flex items-start gap-space-md">
      <div class="w-12 h-12 rounded-xl bg-[#1E3A8A] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-white">folder_zip</span></div>
      <div class="flex-1 min-w-0"><div class="text-title-md font-title-md">Proje dosyası (.sebeke.json)</div><div class="text-label-md font-label-md text-on-surface-variant">Bilgisayardaki AutoCAD eklentisi açar (Şebeke Hakediş › Telefondan Al). Başka telefona da aktarılır.</div></div>
    </div>
    <div class="grid grid-cols-2 gap-space-sm"><button data-a="projePaylas" class="btn btn-main h-12"><span class="material-symbols-outlined">ios_share</span>Paylaş</button><button data-a="projeKaydet" class="btn btn-line h-12"><span class="material-symbols-outlined">save_alt</span>Kaydet</button></div>
  </section>

  <section class="card p-space-md flex flex-col gap-space-sm">
    <div class="flex items-start gap-space-md">
      <div class="w-12 h-12 rounded-xl bg-[#17703A] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-white">table_chart</span></div>
      <div class="flex-1 min-w-0"><div class="text-title-md font-title-md">Durum Tespit raporu (Excel)</div><div class="text-label-md font-label-md text-on-surface-variant">PROMAGIS raporuyla aynı sayfalar: ÖZET, DURUM TESPİT, ANA MALZEME, HAT VE İLETKENLER, KANALLAR…</div></div>
    </div>
    <label class="flex items-center justify-between min-h-[44px] gap-space-sm"><span class="text-body-md font-body-md">Yalnız aktif hakediş (<span data-b="hak">H1</span>)</span><input type="checkbox" data-c="yalnizHak" class="w-6 h-6 accent-[#0D4A7A] shrink-0"></label>
    <div class="grid grid-cols-2 gap-space-sm"><button data-a="excelPaylas" class="btn btn-main h-12"><span class="material-symbols-outlined">ios_share</span>Paylaş</button><button data-a="excelKaydet" class="btn btn-line h-12"><span class="material-symbols-outlined">save_alt</span>Kaydet</button></div>
  </section>

  <section class="card p-space-md flex flex-col gap-space-sm">
    <div class="flex items-start gap-space-md">
      <div class="w-12 h-12 rounded-xl bg-[#B45309] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-white">architecture</span></div>
      <div class="flex-1 min-w-0"><div class="text-title-md font-title-md">Çizim (DXF)</div><div class="text-label-md font-label-md text-on-surface-variant">Görüntülemek için: direkler, hatlar, kanallar, bölgeler ve etiketler PROMAGIS katmanlarında.</div></div>
    </div>
    <div class="grid grid-cols-2 gap-space-sm"><button data-a="dxfPaylas" class="btn btn-main h-12"><span class="material-symbols-outlined">ios_share</span>Paylaş</button><button data-a="dxfKaydet" class="btn btn-line h-12"><span class="material-symbols-outlined">save_alt</span>Kaydet</button></div>
  </section>

  <section class="card p-space-md flex flex-col gap-space-sm">
    <div class="flex items-start gap-space-md">
      <div class="w-12 h-12 rounded-xl bg-[#6D28D9] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-white">pin_drop</span></div>
      <div class="flex-1 min-w-0"><div class="text-title-md font-title-md">Noktalar (CSV)</div><div class="text-label-md font-label-md text-on-surface-variant">Ad;Y (Sağa);X (Yukarı);Kot;Kod — elemanlar ve GPS noktaları; NetCAD ve diğer programlar okur.</div></div>
    </div>
    <div class="grid grid-cols-2 gap-space-sm"><button data-a="csvPaylas" class="btn btn-main h-12"><span class="material-symbols-outlined">ios_share</span>Paylaş</button><button data-a="csvKaydet" class="btn btn-line h-12"><span class="material-symbols-outlined">save_alt</span>Kaydet</button></div>
  </section>

  <section class="card p-space-md flex items-center gap-space-md">
    <div class="w-12 h-12 rounded-xl bg-[#0369A1] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-white">photo_library</span></div>
    <div class="flex-1 min-w-0"><div class="text-title-md font-title-md">Fotoğraflar (zip)</div><div class="text-label-md font-label-md text-on-surface-variant" data-b="foto">—</div></div>
    <button data-a="fotoPaylas" class="btn btn-main h-12"><span class="material-symbols-outlined">ios_share</span></button>
  </section>
</main>
</template>
