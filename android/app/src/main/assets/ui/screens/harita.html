<!-- M03 Harita: ana çalışma ekranı. Alt paneller: M04 Eleman Koy, M06 Hat, M07 Kanal, seçim, bölge çizimi. -->
<template data-body-class="bg-background font-body-md text-on-surface antialiased overflow-hidden">
<header class="fixed top-0 w-full z-50 pt-safe bg-primary-container shadow-[0_1px_8px_rgba(0,0,0,0.12)]">
  <div class="h-14 pl-2 pr-1 flex items-center gap-1">
    <button data-a="proje" class="w-11 h-11 flex items-center justify-center text-on-primary" aria-label="Proje"><span class="material-symbols-outlined">folder_open</span></button>
    <h1 class="flex-1 text-title-md font-title-md text-on-primary truncate" data-b="ad">Harita</h1>
    <button data-a="geriAl" class="w-11 h-11 flex items-center justify-center text-on-primary disabled:opacity-40" aria-label="Geri al"><span class="material-symbols-outlined">replay</span></button>
    <button data-a="menu" class="w-11 h-11 flex items-center justify-center text-on-primary" aria-label="Harita seçenekleri"><span class="material-symbols-outlined">more_vert</span></button>
  </div>
  <button data-a="konum" class="w-full bg-surface-container-high px-margin h-9 flex items-center gap-space-sm text-left">
    <div class="h-6 px-2 rounded-full flex items-center gap-1 shrink-0" data-chip><span class="w-2 h-2 rounded-full" data-dot></span><span class="text-label-sm font-label-sm font-bold" data-b="fix-label">Konum yok</span></div>
    <span class="text-label-md font-label-md text-on-surface num shrink-0" data-b="fix-hrms">—</span>
    <span class="text-label-sm font-label-sm text-on-surface-variant num truncate flex-1 text-right" data-b="koord"></span>
  </button>
</header>

<div data-map class="fixed left-0 right-0 overflow-hidden bg-[#EEF1F4] touch-none" style="top: calc(env(safe-area-inset-top, 0px) + 92px); bottom: calc(72px + env(safe-area-inset-bottom, 0px));">
  <div data-tiles class="absolute inset-0 pointer-events-none"></div>
  <canvas class="absolute inset-0"></canvas>
  <div data-attrib hidden class="absolute right-1 bottom-1 text-[10px] leading-[14px] bg-white/80 px-1 rounded pointer-events-none"></div>

  <!-- Adım yazısı (hat / kanal / bölge çizerken) -->
  <div data-show="adim" hidden class="absolute top-2 left-2 right-2 adim">
    <span class="material-symbols-outlined">touch_app</span>
    <span class="flex-1 min-w-0" data-b="adim">—</span>
    <button data-a="adimGeri" data-show="adimGeri" hidden class="h-9 px-2 rounded-lg bg-white/15 flex items-center"><span class="material-symbols-outlined">backspace</span></button>
    <button data-a="iptal" class="h-9 w-9 rounded-lg bg-white/15 flex items-center justify-center" aria-label="Vazgeç"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div data-show="adimDugmeler" hidden class="absolute left-2 right-2 bottom-3 flex gap-2">
    <button data-a="konumdanEkle" class="btn btn-soft flex-1 h-12 shadow"><span class="material-symbols-outlined">my_location</span>Konumumu ekle</button>
    <button data-a="merkezdenEkle" class="btn btn-soft flex-1 h-12 shadow"><span class="material-symbols-outlined">filter_center_focus</span>Artıyı ekle</button>
    <button data-a="bitir" class="btn btn-main flex-1 h-12 shadow"><span class="material-symbols-outlined">check</span>Bitir</button>
  </div>

  <!-- Son kayıt çubuğu -->
  <div data-show="son" hidden class="absolute top-2 left-2 right-2 bg-white rounded-xl shadow-lg p-2 pl-3 flex items-center gap-2">
    <span class="material-symbols-outlined text-success">check_circle</span>
    <span class="flex-1 min-w-0 truncate text-body-md font-body-md font-semibold" data-b="son">—</span>
    <button data-a="sonHat" data-show="sonHat" hidden class="btn btn-main !min-h-[40px] !px-3 text-[14px]"><span class="material-symbols-outlined text-[20px]">timeline</span><span data-b="sonHat">Hat çek</span></button>
    <button data-a="sonKapat" class="w-9 h-9 flex items-center justify-center text-secondary"><span class="material-symbols-outlined">close</span></button>
  </div>

  <!-- Sağ üst harita düğmeleri -->
  <div data-show="araclar" class="absolute right-2 top-2 flex flex-col gap-2">
    <button data-a="katmanlar" class="map-btn" aria-label="Katmanlar"><span class="material-symbols-outlined">layers</span></button>
    <button data-a="izle" data-izle class="map-btn" aria-label="Konumu izle"><span class="material-symbols-outlined">my_location</span></button>
    <button data-a="tumu" class="map-btn" aria-label="Tümünü göster"><span class="material-symbols-outlined">zoom_out_map</span></button>
  </div>

  <!-- Sol alt: aktif hakediş -->
  <button data-a="hakedis" data-show="araclar" class="absolute left-2 bottom-9 h-11 px-3 rounded-xl bg-white/95 shadow-md flex items-center gap-1 text-primary-container">
    <span class="text-label-sm font-label-sm text-on-surface-variant">HAK.</span><span class="text-title-md font-title-md num" data-b="hak">1</span>
  </button>

  <!-- Yüzen düğmeler (başparmak altında) -->
  <div data-show="fablar">
    <button data-a="kanal" class="fab right-[22px] bottom-[206px] w-14 h-14 bg-white text-[#B45309] flex-col" aria-label="Kanal çiz"><span class="material-symbols-outlined">route</span><span class="text-[10px] font-bold leading-none">KANAL</span></button>
    <button data-a="hat" class="fab right-[22px] bottom-[138px] w-14 h-14 bg-white text-primary-container flex-col" aria-label="Hat çiz"><span class="material-symbols-outlined">timeline</span><span class="text-[10px] font-bold leading-none">HAT</span></button>
    <button data-a="koy" class="fab right-[14px] bottom-9 w-[72px] h-[72px] bg-[#C2410C] text-white flex-col" aria-label="Ölç ve koy"><span class="material-symbols-outlined text-[30px]">add_location_alt</span><span class="text-[11px] font-bold leading-none mt-0.5">KOY</span></button>
  </div>
</div>

<nav data-show="nav" class="fixed bottom-0 w-full z-40 pb-safe bg-surface shadow-[0_-2px_12px_rgba(0,0,0,0.08)]"><div class="h-[72px] flex items-center justify-around px-margin">
  <a data-path="proje" class="flex flex-col items-center justify-center min-w-[72px] min-h-[56px] text-secondary"><span class="material-symbols-outlined text-[26px]">folder_open</span><span class="text-label-sm font-label-sm mt-space-xs">Proje</span></a>
  <a data-path="harita" class="flex flex-col items-center justify-center min-w-[72px] min-h-[56px] text-secondary"><span class="material-symbols-outlined text-[26px]">map</span><span class="text-label-sm font-label-sm mt-space-xs">Harita</span></a>
  <a data-path="hakedis" class="flex flex-col items-center justify-center min-w-[72px] min-h-[56px] text-secondary"><span class="material-symbols-outlined text-[26px]">receipt_long</span><span class="text-label-sm font-label-sm mt-space-xs">Hakediş</span></a>
</div></nav>

<!-- M04 Eleman koy -->
<div data-show="panelKoy" hidden class="sheet" data-panel="koy">
  <div class="grip"></div>
  <div class="body flex flex-col gap-space-sm">
    <div class="flex items-center gap-space-sm">
      <div class="h-7 px-2 rounded-full flex items-center gap-1 shrink-0" data-kchip><span class="w-2 h-2 rounded-full" data-kdot></span><span class="text-label-sm font-label-sm font-bold" data-b="kKalite">—</span></div>
      <span class="flex-1"></span>
      <button data-a="yenidenOlc" class="h-9 px-2 rounded-lg bg-surface-container text-primary-container flex items-center gap-1 text-label-md font-label-md shrink-0"><span class="material-symbols-outlined text-[20px]">refresh</span><span data-b="kOlcDugme">Ölç</span></button>
    </div>
    <div class="text-label-md font-label-md num text-on-surface -mt-1" data-b="kKoord">—</div>
    <div class="chips" id="turler"></div>
    <div data-show="kEleman" class="flex flex-col gap-space-sm">
      <button data-a="tipSec" class="w-full min-h-[56px] rounded-xl border-[1.5px] border-[#B6C2CF] px-space-md flex items-center gap-space-sm text-left">
        <div class="min-w-0 flex-1"><div class="field-label">Tip</div><div class="text-title-md font-title-md truncate" data-b="kTip">Seçilmedi</div></div>
        <span class="text-label-md font-label-md text-on-surface-variant num shrink-0" data-b="kTipAlt"></span>
        <span class="material-symbols-outlined text-secondary">chevron_right</span>
      </button>
      <div class="seg" data-seg="kDurum"></div>
      <div data-show="kDm" hidden class="seg" data-seg="kDmDurum"></div>
      <div class="grid grid-cols-2 gap-space-sm">
        <div class="flex flex-col gap-1"><label class="field-label">GIS no</label><input data-b="kGis" class="input" autocomplete="off" autocapitalize="characters"></div>
        <button data-a="hakedis" class="flex flex-col gap-1 text-left"><span class="field-label">Hakediş</span><span class="input flex items-center justify-between"><span class="num" data-b="kHak">1</span><span class="material-symbols-outlined text-secondary">unfold_more</span></span></button>
      </div>
    </div>
    <div data-show="kNokta" hidden class="grid grid-cols-2 gap-space-sm">
      <div class="flex flex-col gap-1"><label class="field-label">Nokta adı</label><input data-b="kNAd" class="input" autocomplete="off" autocapitalize="characters"></div>
      <div class="flex flex-col gap-1"><label class="field-label">Kod / açıklama</label><input data-b="kNKod" class="input" autocomplete="off"></div>
    </div>
  </div>
  <div class="foot flex gap-space-sm">
    <button data-a="panelKapat" class="btn btn-soft h-14 w-14 !px-0" aria-label="Vazgeç"><span class="material-symbols-outlined">close</span></button>
    <button data-a="koyKaydet" class="btn btn-measure h-14 flex-1 text-[17px]"><span class="material-symbols-outlined">save</span><span data-b="kKaydet">Kaydet</span></button>
  </div>
</div>

<!-- M06 Hat -->
<div data-show="panelHat" hidden class="sheet" data-panel="hat">
  <div class="grip"></div>
  <div class="body flex flex-col gap-space-sm">
    <div class="flex items-center gap-space-sm"><span class="material-symbols-outlined text-primary-container">timeline</span><span class="text-title-md font-title-md truncate flex-1" data-b="hBaslik">Hat</span></div>
    <div class="chips" id="hatTurleri"></div>
    <button data-a="kesitSec" class="w-full min-h-[56px] rounded-xl border-[1.5px] border-[#B6C2CF] px-space-md flex items-center gap-space-sm text-left">
      <div class="min-w-0 flex-1"><div class="field-label">Kesit</div><div class="text-title-md font-title-md truncate" data-b="hKesit">Seçilmedi</div></div>
      <span class="material-symbols-outlined text-secondary">chevron_right</span>
    </button>
    <div class="seg" data-seg="hDurum"></div>
    <div class="flex items-center gap-space-sm">
      <div class="flex-1"><div class="field-label">Çizim</div><div class="text-title-md font-title-md num" data-b="hCizim">—</div></div>
      <span class="material-symbols-outlined text-secondary">arrow_forward</span>
      <div class="flex-1 flex flex-col gap-1"><label class="field-label">Metraj (m)</label><input data-b="hMetraj" class="input num" inputmode="decimal"></div>
    </div>
    <div class="text-label-md font-label-md text-on-surface-variant">Etiket: <span class="text-on-surface font-semibold" data-b="hEtiket">—</span></div>
  </div>
  <div class="foot flex gap-space-sm">
    <button data-a="iptal" class="btn btn-soft h-14 w-14 !px-0" aria-label="Vazgeç"><span class="material-symbols-outlined">close</span></button>
    <button data-a="hatKaydet" class="btn btn-main h-14 flex-1 text-[17px]"><span class="material-symbols-outlined">save</span>Hattı Kaydet</button>
  </div>
</div>

<!-- M07 Kanal -->
<div data-show="panelKanal" hidden class="sheet" data-panel="kanal">
  <div class="grip"></div>
  <div class="body flex flex-col gap-space-sm">
    <div class="flex items-center gap-space-sm"><span class="material-symbols-outlined text-[#B45309]">route</span><span class="text-title-md font-title-md">Kablo Kanalı</span></div>
    <div class="field-label">Kanaldaki kablolar</div>
    <div class="grid grid-cols-4 gap-space-xs" id="kablolar"></div>
    <div class="field-label">Zemin</div>
    <div class="chips" id="zeminler"></div>
    <div class="grid grid-cols-3 gap-space-sm">
      <div class="flex flex-col gap-1"><label class="field-label">Alt (cm)</label><input data-b="cAlt" class="input num" inputmode="numeric"></div>
      <div class="flex flex-col gap-1"><label class="field-label">Üst (cm)</label><input data-b="cUst" class="input num" inputmode="numeric"></div>
      <div class="flex flex-col gap-1"><label class="field-label">Derinlik</label><input data-b="cDer" class="input num" inputmode="numeric"></div>
    </div>
    <div class="grid grid-cols-2 gap-space-sm items-end">
      <div class="flex flex-col gap-1"><label class="field-label">Metraj (m)</label><input data-b="cMetraj" class="input num" inputmode="decimal"></div>
      <div class="card p-space-sm bg-[#FFF7ED] border-[#FED7AA]"><div class="field-label">Hacim</div><div class="text-readout-lg font-readout-lg num" data-b="cHacim">—</div></div>
    </div>
    <div class="text-label-md font-label-md text-on-surface-variant num" data-b="cBilgi">—</div>
    <div class="seg" data-seg="cDurum"></div>
  </div>
  <div class="foot flex gap-space-sm">
    <button data-a="iptal" class="btn btn-soft h-14 w-14 !px-0" aria-label="Vazgeç"><span class="material-symbols-outlined">close</span></button>
    <button data-a="kanalKaydet" class="btn btn-main h-14 flex-1 text-[17px]"><span class="material-symbols-outlined">save</span>Kanalı Kaydet</button>
  </div>
</div>

<!-- Seçili nesne -->
<div data-show="panelSec" hidden class="sheet" data-panel="sec">
  <div class="grip"></div>
  <div class="body flex flex-col gap-space-sm">
    <div class="flex items-start gap-space-sm">
      <div class="min-w-0 flex-1">
        <div class="text-title-md font-title-md truncate" data-b="sBaslik">—</div>
        <div class="text-body-md font-body-md text-on-surface-variant truncate" data-b="sAlt">—</div>
      </div>
      <span class="rozet" data-rozet></span>
    </div>
    <div class="text-label-md font-label-md text-on-surface-variant num" data-b="sBilgi">—</div>
    <div class="grid grid-cols-4 gap-space-xs" id="secEylemler"></div>
  </div>
</div>
</template>
