<!-- M02 Proje ana ekranı -->
<template data-body-class="bg-background font-body-md text-on-surface min-h-screen antialiased">
<header class="fixed top-0 w-full z-50 pt-safe bg-primary-container shadow-[0_1px_8px_rgba(0,0,0,0.12)]">
  <div class="h-16 px-margin flex items-center gap-space-sm">
    <button data-a="projeler" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-primary" aria-label="Projeler"><span class="material-symbols-outlined">folder_open</span></button>
    <h1 class="flex-1 text-headline-md font-headline-md text-on-primary truncate" data-b="ad">Proje</h1>
    <button data-a="menu" class="w-11 h-11 -mr-2 flex items-center justify-center text-on-primary" aria-label="Seçenekler"><span class="material-symbols-outlined">more_vert</span></button>
  </div>
</header>
<main class="pt-16 pb-[96px] min-h-screen">
  <button data-a="konum" class="w-full bg-surface-container-high px-margin py-space-sm flex items-center justify-between gap-space-sm">
    <div class="flex items-center gap-space-sm min-w-0">
      <div class="h-7 px-space-sm rounded-full flex items-center gap-1 shrink-0" data-chip><span class="w-2 h-2 rounded-full" data-dot></span><span class="text-label-sm font-label-sm font-bold" data-b="fix-label">Konum yok</span></div>
      <span class="text-label-md font-label-md text-on-surface num" data-b="fix-hrms">—</span>
      <span class="text-label-md font-label-md text-on-surface-variant truncate" data-b="kaynak">—</span>
    </div>
    <span class="material-symbols-outlined text-secondary">chevron_right</span>
  </button>
  <div data-show="domYok" hidden class="mx-margin mt-space-md p-space-md rounded-xl bg-warning-container text-on-warning-container flex items-start gap-space-sm">
    <span class="material-symbols-outlined">warning</span>
    <div class="flex-1"><b>Koordinat dilimi seçilmedi.</b> GNSS konumu ve harita altlığı projeye oturmaz.</div>
    <button data-a="domSec" class="btn btn-main !min-h-[40px] !px-3 text-[14px]">Seç</button>
  </div>
  <div class="px-margin pt-space-md grid grid-cols-2 gap-gutter">
    <button data-a="hakedis" class="card p-space-md text-left active:bg-surface-container-low">
      <div class="field-label">Aktif hakediş</div>
      <div class="flex items-center justify-between mt-1"><span class="text-readout-xl font-readout-xl text-primary-container num" data-b="hakedis">1</span><span class="material-symbols-outlined text-secondary">unfold_more</span></div>
    </button>
    <button data-a="bolge" class="card p-space-md text-left active:bg-surface-container-low min-w-0">
      <div class="field-label">Bölge (sayılar)</div>
      <div class="flex items-center justify-between mt-1 gap-1 min-w-0"><span class="text-title-md font-title-md text-on-surface truncate" data-b="bolge">Tümü</span><span class="material-symbols-outlined text-secondary shrink-0">unfold_more</span></div>
    </button>
  </div>
  <div class="px-margin pt-space-md grid grid-cols-3 gap-space-sm">
    <div class="card p-space-sm text-center"><div class="text-readout-lg font-readout-lg num" data-b="nEleman">0</div><div class="text-label-sm font-label-sm text-on-surface-variant">Eleman</div></div>
    <div class="card p-space-sm text-center"><div class="text-readout-lg font-readout-lg num" data-b="nHat">0</div><div class="text-label-sm font-label-sm text-on-surface-variant">Hat</div></div>
    <div class="card p-space-sm text-center"><div class="text-readout-lg font-readout-lg num" data-b="nKanal">0</div><div class="text-label-sm font-label-sm text-on-surface-variant">Kanal</div></div>
    <div class="card p-space-sm text-center"><div class="text-readout-lg font-readout-lg num text-[#B3261E]" data-b="nDm">0</div><div class="text-label-sm font-label-sm text-on-surface-variant">Demontaj</div></div>
    <div class="card p-space-sm text-center"><div class="text-readout-lg font-readout-lg num" data-b="nNokta">0</div><div class="text-label-sm font-label-sm text-on-surface-variant">GPS noktası</div></div>
    <div class="card p-space-sm text-center"><div class="text-readout-lg font-readout-lg num" data-b="nHak">0</div><div class="text-label-sm font-label-sm text-on-surface-variant">Bu hakedişte</div></div>
  </div>
  <div class="px-margin pt-space-md flex flex-col gap-space-sm">
    <button data-a="harita" class="card p-space-md flex items-center gap-space-md text-left active:bg-surface-container-low">
      <div class="w-12 h-12 rounded-xl bg-[#C2410C] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-white text-[26px]">map</span></div>
      <div class="flex-1"><div class="text-title-md font-title-md">Haritada Çalış</div><div class="text-label-md font-label-md text-on-surface-variant">Ölç ve koy, hat ve kanal çiz</div></div>
      <span class="material-symbols-outlined text-secondary">chevron_right</span>
    </button>
    <button data-a="ozet" class="card p-space-md flex items-center gap-space-md text-left active:bg-surface-container-low">
      <div class="w-12 h-12 rounded-xl bg-[#17703A] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-white text-[26px]">receipt_long</span></div>
      <div class="flex-1"><div class="text-title-md font-title-md">Hakediş Özeti</div><div class="text-label-md font-label-md text-on-surface-variant">Metraj tablosu, toplam kg</div></div>
      <span class="material-symbols-outlined text-secondary">chevron_right</span>
    </button>
    <button data-a="disa" class="card p-space-md flex items-center gap-space-md text-left active:bg-surface-container-low">
      <div class="w-12 h-12 rounded-xl bg-[#1E3A8A] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-white text-[26px]">ios_share</span></div>
      <div class="flex-1"><div class="text-title-md font-title-md">Dışa Aktar / Paylaş</div><div class="text-label-md font-label-md text-on-surface-variant">Proje dosyası, Excel raporu, DXF</div></div>
      <span class="material-symbols-outlined text-secondary">chevron_right</span>
    </button>
    <div class="grid grid-cols-3 gap-space-sm">
      <button data-a="konum" class="card p-space-sm flex flex-col items-center gap-1 active:bg-surface-container-low"><span class="material-symbols-outlined text-[#6D28D9] text-[28px]">satellite_alt</span><span class="text-label-md font-label-md">Konum</span></button>
      <button data-a="bolgeler" class="card p-space-sm flex flex-col items-center gap-1 active:bg-surface-container-low"><span class="material-symbols-outlined text-[#0369A1] text-[28px]">polyline</span><span class="text-label-md font-label-md">Bölgeler</span></button>
      <button data-a="ayarlar" class="card p-space-sm flex flex-col items-center gap-1 active:bg-surface-container-low"><span class="material-symbols-outlined text-secondary text-[28px]">settings</span><span class="text-label-md font-label-md">Ayarlar</span></button>
    </div>
  </div>
</main>
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface shadow-[0_-2px_12px_rgba(0,0,0,0.08)]"><div class="h-[72px] flex items-center justify-around px-margin">
  <a data-path="proje" class="flex flex-col items-center justify-center min-w-[72px] min-h-[56px] text-secondary"><span class="material-symbols-outlined text-[26px]">folder_open</span><span class="text-label-sm font-label-sm mt-space-xs">Proje</span></a>
  <a data-path="harita" class="flex flex-col items-center justify-center min-w-[72px] min-h-[56px] text-secondary"><span class="material-symbols-outlined text-[26px]">map</span><span class="text-label-sm font-label-sm mt-space-xs">Harita</span></a>
  <a data-path="hakedis" class="flex flex-col items-center justify-center min-w-[72px] min-h-[56px] text-secondary"><span class="material-symbols-outlined text-[26px]">receipt_long</span><span class="text-label-sm font-label-sm mt-space-xs">Hakediş</span></a>
</div></nav>
</template>
