<!-- M01 Projeler -->
<template data-body-class="bg-background font-body-md text-on-surface min-h-screen antialiased">
<header class="fixed top-0 w-full z-50 pt-safe bg-primary-container shadow-[0_1px_8px_rgba(0,0,0,0.12)]">
  <div class="h-16 px-margin flex items-center gap-space-sm">
    <span class="material-symbols-outlined text-on-primary text-[28px]">bolt</span>
    <h1 class="flex-1 text-headline-md font-headline-md text-on-primary truncate">Şebeke Hakediş</h1>
    <button data-a="hakkinda" class="w-11 h-11 flex items-center justify-center text-on-primary" aria-label="Hakkında"><span class="material-symbols-outlined">info</span></button>
  </div>
</header>
<main class="pt-16 pb-[120px] min-h-screen">
  <div class="px-margin pt-space-lg pb-space-sm flex items-center justify-between">
    <span class="field-label">Telefondaki projeler</span>
    <span class="text-label-md font-label-md text-secondary" data-b="sayi"></span>
  </div>
  <div id="liste" class="px-margin flex flex-col gap-space-sm">
    <div data-tpl="proje" data-a="sec" role="button" class="card p-space-md flex items-center gap-space-md active:bg-surface-container-low">
      <div class="w-12 h-12 rounded-xl bg-[#DCEAF6] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-primary-container text-[26px]">folder_open</span></div>
      <div class="min-w-0 flex-1">
        <div class="text-title-md font-title-md text-on-surface truncate" data-f="ad">Proje</div>
        <div class="text-label-md font-label-md text-on-surface-variant mt-0.5 truncate" data-f="alt">—</div>
        <div class="text-label-sm font-label-sm text-secondary mt-0.5" data-f="zaman">—</div>
      </div>
      <button data-a="menu" class="w-11 h-11 -mr-2 flex items-center justify-center text-secondary" aria-label="Seçenekler"><span class="material-symbols-outlined">more_vert</span></button>
    </div>
  </div>
  <div data-show="bos" hidden class="mx-margin mt-space-sm p-space-lg card text-center flex flex-col items-center gap-space-sm">
    <span class="material-symbols-outlined text-[52px] text-outline">folder_open</span>
    <p class="text-title-md font-title-md text-on-surface">Henüz proje yok</p>
    <p class="text-body-md font-body-md text-on-surface-variant">Bilgisayardaki AutoCAD eklentisiyle hazırlanan <b>.sebeke.json</b> dosyasını açın (Drive, WhatsApp, e-posta…) ya da sahada yeni proje başlatın.</p>
  </div>
</main>
<div class="fixed bottom-0 left-0 right-0 z-50 bg-surface pb-safe shadow-[0_-2px_12px_rgba(0,0,0,0.08)]">
  <div class="p-margin grid grid-cols-2 gap-gutter">
    <button data-a="ac" class="btn btn-line h-14"><span class="material-symbols-outlined">upload_file</span>Dosyadan Aç</button>
    <button data-a="yeni" class="btn btn-main h-14"><span class="material-symbols-outlined">add</span>Yeni Proje</button>
  </div>
</div>
</template>
