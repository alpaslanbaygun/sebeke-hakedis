<!-- M09 Malzeme ekle -->
<template data-body-class="bg-background font-body-md text-on-surface min-h-screen antialiased">
<header class="fixed top-0 w-full z-50 pt-safe bg-primary-container shadow-[0_1px_8px_rgba(0,0,0,0.12)]">
  <div class="h-16 px-margin flex items-center gap-space-sm">
    <button data-a="back" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-primary" aria-label="Geri"><span class="material-symbols-outlined">arrow_back</span></button>
    <h1 class="flex-1 text-headline-md font-headline-md text-on-primary truncate">Malzeme Ekle</h1>
  </div>
</header>
<main class="pt-16 pb-[24px] min-h-screen">
  <div class="px-margin pt-space-md sticky top-16 z-10 bg-background pb-space-sm flex flex-col gap-space-sm">
    <div class="relative"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">search</span>
      <input data-b="ara" class="input !pl-11" placeholder="Ara: travers, izolatör, 3x95…" autocomplete="off"></div>
    <div class="chips" id="gruplar"></div>
  </div>
  <div id="liste" class="border-t border-[#ECEEF0]"></div>
  <div data-show="bos" hidden class="m-margin p-space-lg card text-center text-on-surface-variant">Eşleşen malzeme yok.</div>
  <div class="p-margin"><button data-a="elle" class="btn btn-line w-full h-12"><span class="material-symbols-outlined">edit_note</span>Listede yok — elle gir</button></div>
</main>
<div data-show="panel" hidden class="sheet">
  <div class="grip"></div>
  <div class="body flex flex-col gap-space-sm">
    <div><div class="text-title-md font-title-md" data-b="pAd">—</div><div class="text-label-md font-label-md text-on-surface-variant" data-b="pAlt">—</div></div>
    <div class="flex items-end gap-space-sm">
      <div class="flex-1 flex flex-col gap-1"><label class="field-label" data-b="pMiktarEt">Miktar</label><input data-b="pMiktar" class="input num !h-16 !text-[28px]" inputmode="decimal"></div>
      <div class="flex-1 card p-space-sm bg-[#F0F9FF] border-[#BAE6FD]"><div class="field-label">Toplam</div><div class="text-readout-lg font-readout-lg num" data-b="pToplam">—</div></div>
    </div>
    <div class="seg" data-seg="pDurum"></div>
  </div>
  <div class="foot flex gap-space-sm">
    <button data-a="panelKapat" class="btn btn-soft h-14 w-14 !px-0" aria-label="Vazgeç"><span class="material-symbols-outlined">close</span></button>
    <button data-a="ekle" class="btn btn-main h-14 flex-1 text-[17px]"><span class="material-symbols-outlined">add</span>Ekle</button>
  </div>
</div>
</template>
