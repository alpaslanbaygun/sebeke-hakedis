<!-- M11 Hakediş özeti -->
<template data-body-class="bg-background font-body-md text-on-surface min-h-screen antialiased">
<header class="fixed top-0 w-full z-50 pt-safe bg-primary-container shadow-[0_1px_8px_rgba(0,0,0,0.12)]">
  <div class="h-16 px-margin flex items-center gap-space-sm">
    <button data-a="proje" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-primary" aria-label="Proje"><span class="material-symbols-outlined">folder_open</span></button>
    <h1 class="flex-1 text-headline-md font-headline-md text-on-primary truncate">Hakediş Özeti</h1>
    <button data-a="excel" class="h-10 px-3 rounded-lg bg-white/15 text-on-primary flex items-center gap-1 text-label-lg font-label-lg" aria-label="Excel'e aktar"><span class="material-symbols-outlined">table_chart</span>Excel</button>
  </div>
</header>
<main class="pt-16 pb-[96px] min-h-screen">
  <div class="px-margin pt-space-md grid grid-cols-2 gap-gutter">
    <button data-a="hakedis" class="card p-space-sm px-space-md text-left active:bg-surface-container-low">
      <div class="field-label">Hakediş</div>
      <div class="flex items-center justify-between"><span class="text-title-md font-title-md truncate" data-b="hakedis">Tümü</span><span class="material-symbols-outlined text-secondary">unfold_more</span></div>
    </button>
    <button data-a="bolge" class="card p-space-sm px-space-md text-left active:bg-surface-container-low min-w-0">
      <div class="field-label">Bölge</div>
      <div class="flex items-center justify-between gap-1"><span class="text-title-md font-title-md truncate" data-b="bolge">Tümü</span><span class="material-symbols-outlined text-secondary shrink-0">unfold_more</span></div>
    </button>
  </div>
  <div class="px-margin pt-space-sm"><div class="chips" id="sekmeler"></div></div>
  <div class="mx-margin mt-space-sm card p-space-md bg-[#0D4A7A] border-[#0D4A7A] text-white flex items-end justify-between">
    <div><div class="text-label-md font-label-md opacity-80">Toplam ağırlık</div><div class="text-readout-xl font-readout-xl num" data-b="kg">0 kg</div></div>
    <div class="text-right text-label-md font-label-md opacity-90 num" data-b="satir">0 satır</div>
  </div>
  <div class="px-margin pt-space-md pb-space-xs flex items-center justify-between"><span class="field-label">Cinse göre</span><button data-a="hepsiniAc" class="text-label-md font-label-md text-primary-container" data-b="hepsiniAc">Hepsini aç</button></div>
  <div id="gruplar" class="flex flex-col gap-space-sm px-margin pb-space-md"></div>
  <div data-show="bos" hidden class="m-margin p-space-lg card text-center text-on-surface-variant">Bu seçimde kalem yok.</div>
</main>
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface shadow-[0_-2px_12px_rgba(0,0,0,0.08)]"><div class="h-[72px] flex items-center justify-around px-margin">
  <a data-path="proje" class="flex flex-col items-center justify-center min-w-[72px] min-h-[56px] text-secondary"><span class="material-symbols-outlined text-[26px]">folder_open</span><span class="text-label-sm font-label-sm mt-space-xs">Proje</span></a>
  <a data-path="harita" class="flex flex-col items-center justify-center min-w-[72px] min-h-[56px] text-secondary"><span class="material-symbols-outlined text-[26px]">map</span><span class="text-label-sm font-label-sm mt-space-xs">Harita</span></a>
  <a data-path="hakedis" class="flex flex-col items-center justify-center min-w-[72px] min-h-[56px] text-secondary"><span class="material-symbols-outlined text-[26px]">receipt_long</span><span class="text-label-sm font-label-sm mt-space-xs">Hakediş</span></a>
</div></nav>
</template>
