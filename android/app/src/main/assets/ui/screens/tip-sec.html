<!-- M05 Tip seçici -->
<template data-body-class="bg-background font-body-md text-on-surface min-h-screen antialiased">
<header class="fixed top-0 w-full z-50 pt-safe bg-primary-container shadow-[0_1px_8px_rgba(0,0,0,0.12)]">
  <div class="h-16 px-margin flex items-center gap-space-sm">
    <button data-a="back" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-primary" aria-label="Geri"><span class="material-symbols-outlined">arrow_back</span></button>
    <h1 class="flex-1 text-headline-md font-headline-md text-on-primary truncate" data-b="baslik">Tip Seçin</h1>
  </div>
</header>
<main class="pt-16 pb-[96px] min-h-screen">
  <div class="px-margin pt-space-md sticky top-16 z-10 bg-background pb-space-sm">
    <div class="relative"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">search</span>
      <input data-b="ara" class="input !pl-11" placeholder="Ara: G-10I, ALPEK, 3x95…" autocomplete="off"></div>
  </div>
  <section data-show="sonBolum" class="px-margin">
    <div class="field-label py-space-sm">Son kullanılanlar</div>
    <div id="son" class="grid grid-cols-2 gap-space-sm"></div>
  </section>
  <section data-show="yildizBolum" hidden class="px-margin">
    <div class="field-label py-space-sm">Yıldızlılar</div>
    <div id="yildiz" class="grid grid-cols-2 gap-space-sm"></div>
  </section>
  <div class="field-label px-margin pt-space-md pb-space-sm" data-b="tumBaslik">Tüm tipler</div>
  <div id="tum" class="border-t border-[#ECEEF0]"></div>
  <div data-show="bos" hidden class="m-margin p-space-lg card text-center text-on-surface-variant">Eşleşen tip yok. Aşağıdan elle girebilirsiniz.</div>
</main>
<div class="fixed bottom-0 left-0 right-0 z-50 bg-surface pb-safe shadow-[0_-2px_12px_rgba(0,0,0,0.08)]">
  <div class="p-margin"><button data-a="elle" class="btn btn-line w-full h-12"><span class="material-symbols-outlined">edit_note</span>Listede yok — elle gir</button></div>
</div>
</template>
