<!-- M08 Eleman / hat / kanal ayrıntısı -->
<template data-body-class="bg-background font-body-md text-on-surface min-h-screen antialiased">
<header class="fixed top-0 w-full z-50 pt-safe bg-primary-container shadow-[0_1px_8px_rgba(0,0,0,0.12)]">
  <div class="h-16 px-margin flex items-center gap-space-sm">
    <button data-a="back" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-primary" aria-label="Geri"><span class="material-symbols-outlined">arrow_back</span></button>
    <h1 class="flex-1 text-headline-md font-headline-md text-on-primary truncate" data-b="baslik">Ayrıntı</h1>
    <button data-a="haritada" class="w-11 h-11 flex items-center justify-center text-on-primary" aria-label="Haritada göster"><span class="material-symbols-outlined">map</span></button>
    <button data-a="menu" class="w-11 h-11 -mr-2 flex items-center justify-center text-on-primary" aria-label="Seçenekler"><span class="material-symbols-outlined">more_vert</span></button>
  </div>
</header>
<main class="pt-[76px] pb-[110px] min-h-screen flex flex-col gap-space-md">
  <section class="mx-margin mt-space-md card p-space-md flex flex-col gap-space-sm">
    <div class="flex items-start gap-space-sm">
      <div class="min-w-0 flex-1">
        <div class="text-title-md font-title-md" data-b="tip">—</div>
        <div class="text-label-md font-label-md text-on-surface-variant" data-b="cins">—</div>
      </div>
      <span class="rozet" data-rozet></span>
    </div>
    <div class="grid grid-cols-2 gap-x-space-md gap-y-space-sm text-body-md font-body-md" id="ozet"></div>
    <div class="text-label-md font-label-md text-on-surface-variant num" data-b="koord">—</div>
    <div class="text-label-sm font-label-sm text-secondary" data-b="olcum"></div>
  </section>

  <section class="mx-margin">
    <div class="flex items-center justify-between pb-space-sm"><span class="field-label">Kalemler</span><span class="text-label-md font-label-md text-on-surface-variant num" data-b="kalemOzet"></span></div>
    <div id="kalemler" class="card overflow-hidden"></div>
    <button data-a="malzemeEkle" class="btn btn-line w-full h-12 mt-space-sm"><span class="material-symbols-outlined">add</span>Malzeme Ekle</button>
  </section>

  <section class="mx-margin">
    <div class="field-label pb-space-sm">Fotoğraflar</div>
    <div class="flex gap-space-sm overflow-x-auto pb-1" id="fotolar"></div>
  </section>

  <section class="mx-margin flex flex-col gap-space-xs">
    <label class="field-label" for="not">Not</label>
    <textarea id="not" data-b="not" rows="3" class="w-full border border-[#B6C2CF] rounded-xl p-3 text-body-md font-body-md outline-none focus:border-[#0D4A7A] focus:border-2" placeholder="Saha notu (ör. direk eğik, kablo hasarlı)"></textarea>
  </section>
</main>
<div class="fixed bottom-0 left-0 right-0 z-50 bg-surface pb-safe shadow-[0_-2px_12px_rgba(0,0,0,0.08)]">
  <div class="p-margin flex gap-space-sm">
    <button data-a="foto" class="btn btn-soft h-14 flex-1"><span class="material-symbols-outlined">photo_camera</span>Fotoğraf</button>
    <button data-a="kapat" class="btn btn-main h-14 flex-1"><span class="material-symbols-outlined">check</span>Tamam</button>
  </div>
</div>
</template>
