name: Telefon uygulaması

# Her gönderimde: hesap çekirdeği testleri (Node) → Kotlin testleri → APK → sürüm.
# Sonuçlar "ci-sonuc-android" dalına, APK "Releases" bölümüne yazılır.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ortak/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sürüm numarası
        id: surum
        run: |
          s="0.2.${GITHUB_RUN_NUMBER}"
          echo "surum=$s" >> "$GITHUB_OUTPUT"
          mkdir -p cikti
          printf 'Sürüm: %s\nİşlem: %s\nTarih: %s\n' "$s" "$GITHUB_SHA" "$(date -Iseconds)" > cikti/ozet.txt

      - name: Hesap çekirdeği testleri (JavaScript)
        run: |
          set -o pipefail
          node android/araclar/cekirdek-test.js 2>&1 | tee cikti/js-test.log
          node android/araclar/simge-denetimi.js 2>&1 | tee -a cikti/js-test.log
          echo "JS TEST: geçti" >> cikti/ozet.txt

      - name: Kotlin testleri ve APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleRelease \
            -PsurumKodu=${GITHUB_RUN_NUMBER} -PsurumAdi=${{ steps.surum.outputs.surum }} 2>&1 | tee ../cikti/gradle.log
          echo "GRADLE: geçti" >> ../cikti/ozet.txt

      - name: Test raporlarını topla
        if: always()
        run: |
          mkdir -p cikti/test-sonuclari
          cp -r android/app/build/test-results/testDebugUnitTest/*.xml cikti/test-sonuclari/ 2>/dev/null || true
          ls android/app/build/outputs/apk/release/ 2>/dev/null >> cikti/ozet.txt || true

      - name: APK
        run: |
          s="${{ steps.surum.outputs.surum }}"
          cp android/app/build/outputs/apk/release/app-release.apk "cikti/SebekeHakedis-$s.apk"
          ls -la cikti >> cikti/ozet.txt

      - name: GitHub sürümü oluştur
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s="${{ steps.surum.outputs.surum }}"
          gh release create "mobil-$s" "cikti/SebekeHakedis-$s.apk" --title "Telefon uygulaması $s" \
            --notes "Kurulum: APK'yı telefona indirin ve açın (bilinmeyen kaynaklara izin verin). Eski sürümün üzerine veriler silinmeden kurulur."

      - name: Sonuçları ci-sonuc-android dalına yaz
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          tmp="$RUNNER_TEMP/sonuc"
          mkdir -p "$tmp"
          rm -f cikti/*.apk
          cp -r cikti/. "$tmp/"
          git checkout --orphan ci-sonuc-android-yeni
          git rm -rf . --quiet
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$tmp/." .
          git add -A
          git commit -m "ci: ${{ steps.surum.outputs.surum }} ($GITHUB_SHA)" --quiet
          git push -f origin HEAD:ci-sonuc-android
