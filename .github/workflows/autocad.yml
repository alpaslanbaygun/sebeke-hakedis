name: AutoCAD eklentisi

# Her gönderimde: çekirdek testleri → iki derleme (AutoCAD 2016–2024 ve 2025+) → kurulum paketi.
# main dalında: sonuçlar "ci-sonuc" dalına, paket "Releases" bölümüne yazılır.
# Diğer dallarda: yalnız test ve derleme; paket ve günlükler iş akışı eki (artifact) olarak kalır.

on:
  push:
    branches: [main, hat-malzeme-simge, sebeke-m, imzalama]
    paths:
      - 'autocad/**'
      - 'ortak/**'
      - '!**/*.md'
      - '.github/workflows/autocad.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autocad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  derle:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarası
        id: surum
        shell: pwsh
        run: |
          $s = "0.1.$env:GITHUB_RUN_NUMBER"
          "surum=$s" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force cikti | Out-Null
          "Sürüm: $s`nİşlem: $env:GITHUB_SHA`nTarih: $(Get-Date -Format s)" | Out-File -Encoding utf8 cikti/ozet.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hesap Merkezi sayfalarını paketle
        shell: pwsh
        run: |
          node araclar/hesap-paketle.mjs 2>&1 | Tee-Object -FilePath cikti/hesap-paket.log
          if ($LASTEXITCODE -ne 0) { "HESAP PAKETİ: BAŞARISIZ" | Out-File -Append -Encoding utf8 cikti/ozet.txt; exit 1 }
          (Get-ChildItem ortak/hesap/paket -Recurse -File | Measure-Object).Count.ToString() + " dosya paketlendi" | Out-File -Append -Encoding utf8 cikti/hesap-paket.log

      - name: Çekirdek testleri
        shell: pwsh
        run: |
          dotnet run --project autocad/test/CekirdekTest/CekirdekTest.csproj -c Release -- ornek 2>&1 | Tee-Object -FilePath cikti/test.log
          if ($LASTEXITCODE -ne 0) { "TEST: BAŞARISIZ" | Out-File -Append -Encoding utf8 cikti/ozet.txt; exit 1 }
          "TEST: geçti" | Out-File -Append -Encoding utf8 cikti/ozet.txt

      - name: Pencere denemesi (ekran görüntüleri)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cikti/ekran | Out-Null
          dotnet run --project autocad/test/PencereTest/PencereTest.csproj -c Release -- cikti/ekran 2>&1 | Tee-Object -FilePath cikti/pencere-test.log
          if ($LASTEXITCODE -ne 0) { "PENCERE: BAŞARISIZ" | Out-File -Append -Encoding utf8 cikti/ozet.txt; exit 1 }
          "PENCERE: geçti" | Out-File -Append -Encoding utf8 cikti/ozet.txt

      - name: Eklentiyi derle
        shell: pwsh
        run: |
          dotnet build autocad/src/Eklenti/Eklenti.csproj -c Release "-p:Version=${{ steps.surum.outputs.surum }}" -v minimal 2>&1 | Tee-Object -FilePath cikti/derleme.log
          if ($LASTEXITCODE -ne 0) { "DERLEME: BAŞARISIZ" | Out-File -Append -Encoding utf8 cikti/ozet.txt; exit 1 }
          "DERLEME: geçti" | Out-File -Append -Encoding utf8 cikti/ozet.txt

      - name: İmzala (kod imzalama sertifikası tanımlıysa)
        # Sertifika depo sırlarındadır: IMZA_PFX (PFX dosyasının base64 hâli) ve IMZA_PAROLA.
        # Tanımlı değilse DLL'ler imzasız kalır; kurulum güvenilir klasöre yapıldığı için AutoCAD yine uyarmaz.
        shell: pwsh
        env:
          IMZA_PFX: ${{ secrets.IMZA_PFX }}
          IMZA_PAROLA: ${{ secrets.IMZA_PAROLA }}
        run: |
          $dll = @('autocad/src/Eklenti/bin/Release/net46/SebekeHakedis.dll', 'autocad/src/Eklenti/bin/Release/net8.0-windows/SebekeHakedis.dll')
          if (-not $env:IMZA_PFX) {
            "İMZA: yok (kod imzalama sertifikası tanımlı değil; kurulum güvenilir klasöre)" | Out-File -Append -Encoding utf8 cikti/ozet.txt
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'imza.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:IMZA_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { "İMZA: signtool bulunamadı" | Out-File -Append -Encoding utf8 cikti/ozet.txt; exit 1 }
          try {
            foreach ($d in $dll) {
              & $signtool.FullName sign /f $pfx /p $env:IMZA_PAROLA /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Şebeke-M" $d
              if ($LASTEXITCODE -ne 0) { throw "imzalanamadı: $d" }
            }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          foreach ($d in $dll) {
            $i = Get-AuthenticodeSignature $d
            "İMZA: $d → $($i.Status) · $($i.SignerCertificate.Subject)" | Out-File -Append -Encoding utf8 cikti/ozet.txt
          }

      - name: Kurulum paketini hazırla
        shell: pwsh
        run: |
          $s = "${{ steps.surum.outputs.surum }}"
          $kok = "paket/SebekeHakedis-$s"
          $b = "$kok/SebekeHakedis.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/R20-R24", "$b/Contents/R25" | Out-Null
          Copy-Item autocad/src/Eklenti/bin/Release/net46/SebekeHakedis.dll "$b/Contents/R20-R24/"
          Copy-Item autocad/src/Eklenti/bin/Release/net8.0-windows/SebekeHakedis.dll "$b/Contents/R25/"
          (Get-Content -Raw -Encoding utf8 autocad/paket/PackageContents.xml).Replace('SURUM', $s) | Set-Content -Encoding utf8 "$b/PackageContents.xml"
          Copy-Item autocad/paket/KUR.bat, autocad/paket/KALDIR.bat, autocad/paket/OKUBENI.txt $kok/
          Compress-Archive -Path "$kok/*" -DestinationPath "cikti/SebekeHakedis-$s.zip" -Force
          Get-ChildItem -Recurse $kok | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Out-File -Append -Encoding utf8 cikti/ozet.txt
          "PAKET: cikti/SebekeHakedis-$s.zip" | Out-File -Append -Encoding utf8 cikti/ozet.txt

      - name: Kurulum denemesi (KUR.bat / KALDIR.bat)
        shell: pwsh
        run: |
          $s = "${{ steps.surum.outputs.surum }}"
          $acik = Join-Path $env:RUNNER_TEMP 'kur-dene'
          Expand-Archive "cikti/SebekeHakedis-$s.zip" -DestinationPath $acik -Force
          $pf = if ($env:ProgramW6432) { $env:ProgramW6432 } else { $env:ProgramFiles }
          $hedef = Join-Path $pf 'Autodesk\ApplicationPlugins\SebekeHakedis.bundle'
          $kullanici = Join-Path $env:APPDATA 'Autodesk\ApplicationPlugins\SebekeHakedis.bundle'
          # Eski davranışı taklit: kullanıcı klasöründe eski bir kopya varken kurulum onu da temizlemeli
          New-Item -ItemType Directory -Force $kullanici | Out-Null
          Set-Content -Path (Join-Path $kullanici 'PackageContents.xml') -Value '<eski/>'
          & (Join-Path $acik 'KUR.bat') /sessiz 2>&1 | Tee-Object -FilePath cikti/kurulum-denemesi.log
          $ok = (Test-Path (Join-Path $hedef 'PackageContents.xml')) -and
                (Test-Path (Join-Path $hedef 'Contents\R20-R24\SebekeHakedis.dll')) -and
                (Test-Path (Join-Path $hedef 'Contents\R25\SebekeHakedis.dll')) -and
                -not (Test-Path $kullanici)
          "kuruldu: $ok ($hedef)" | Tee-Object -Append -FilePath cikti/kurulum-denemesi.log
          & (Join-Path $acik 'KALDIR.bat') /sessiz 2>&1 | Tee-Object -Append -FilePath cikti/kurulum-denemesi.log
          $kalkti = -not (Test-Path $hedef)
          "kaldırıldı: $kalkti" | Tee-Object -Append -FilePath cikti/kurulum-denemesi.log
          if (-not ($ok -and $kalkti)) { "KURULUM DENEMESİ: BAŞARISIZ" | Out-File -Append -Encoding utf8 cikti/ozet.txt; exit 1 }
          "KURULUM DENEMESİ: geçti (güvenilir klasöre kuruldu, eski kopya temizlendi, kaldırıldı)" | Out-File -Append -Encoding utf8 cikti/ozet.txt

      - name: İş akışı eki (dal denemeleri için)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocad-${{ steps.surum.outputs.surum }}
          path: cikti/
          retention-days: 14

      - name: GitHub sürümü oluştur
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $s = "${{ steps.surum.outputs.surum }}"
          gh release create "v$s" "cikti/SebekeHakedis-$s.zip" --title "Şebeke-M AutoCAD eklentisi $s" --notes "Kurulum: zip'i indirin, bir klasöre çıkarın, KUR.bat'ı çalıştırın ve Windows'un yönetici izni sorusuna Evet deyin (eklenti AutoCAD'in güvenilir klasörüne kurulur, güvenlik uyarısı çıkmaz). AutoCAD'i yeniden başlatın. AutoCAD 2016–2024 ve 2025+ desteklenir."

      - name: Sonuçları ci-sonuc dalına yaz
        # main: ci-sonuc · diğer dallar: ci-sonuc-dal
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          $hedef = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'ci-sonuc' } else { 'ci-sonuc-dal' }
          $tmp = Join-Path $env:RUNNER_TEMP "sonuc"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item cikti/* $tmp -Recurse -Force
          git checkout --orphan ci-sonuc-yeni
          git rm -rf . --quiet
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Copy-Item "$tmp/*" . -Recurse -Force
          git add -A
          git commit -m "ci: ${{ steps.surum.outputs.surum }} ($env:GITHUB_SHA)" --quiet
          git push -f origin "HEAD:$hedef"
